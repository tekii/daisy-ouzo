#
steps:
- name: ${_PYIMAGE}
  entrypoint: 'python'
  args: 
  - '-m'
  - 'pip'
  - 'install'
  - '--progress-bar'
  - 'off'
  - '--root-user-action'
  - 'ignore'
  - '--no-warn-script-location'
  - '--user' # this prevent losing the upgrade between steps
  - '--upgrade'
  - 'pip'
  dir: ${_BUILD_ROOT}

# install tests requeriments
- name: ${_PYIMAGE}
  entrypoint: 'python'
  args: 
  - '-m'
  - 'pip'
  - 'install'
  - '--progress-bar'
  - 'off'
  - '--root-user-action'
  - 'ignore'
  - '--no-warn-script-location'
  - '--user' 
  - '-r'
  - 'src/requirements.txt'
  - '-r'
  - 'requirements_test.txt'
  dir: ${_BUILD_ROOT}

# run the tests
- name: ${_PYIMAGE}
  entrypoint: 'python'
  args: 
  - '-m'
  - 'pytest'
  - '--no-cov'
  dir: ${_BUILD_ROOT}

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: 
  - 'beta'
  - 'run'
  - 'deploy'
  - 'ouzo'
  - '--region'
  - '${LOCATION}'
  - '--allow-unauthenticated'
  - --ingress' 
  - 'internal'
  - '--port' 
  - '12010'
  - '--concurrency' 
  - '8' 
  - '--min-instances' 
  - '0' 
  - '--max-instances' 
  - '2' 
  - '--execution-environment' 
  - 'gen2' 
  - '--service-account' 
  - '${_CRUN_ACCOUNT}' 
  - '--set-build-env-vars' 
  - 'GOOGLE_PYTHON_VERSION="3.12.x"' 
  - '--source'
  - '.'
  dir: ${_BUILD_ROOT}/src

substitutions:
  _PYIMAGE: 'python:3.12'
  _BUILD_ROOT: ouzo_root

options:
  logging: CLOUD_LOGGING_ONLY

#  logging: GCS_ONLY
#logsBucket: 'https://console.cloud.google.com/storage/browser/daisy-dev01_cloudbuild'
